services:
  postgres:
    image: postgres:17-alpine
    container_name: studymatch-postgres
    environment:
      POSTGRES_DB: studymatch
      POSTGRES_USER: studymatch
      POSTGRES_PASSWORD: studymatch_dev
    ports:
      - "5432:5432"
    volumes:
      - studymatch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studymatch -d studymatch"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  studymatch_postgres_data:
