spring:
  application:
    name: studymatch-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studymatch}
    username: ${DB_USER:studymatch}
    password: ${DB_PASSWORD:studymatch_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # Apenas desenvolvimento/Sprint 1; usar migracoes em producao
    properties:
      hibernate:
        format_sql: false
server:
  port: ${SERVER_PORT:8080}
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
